services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Points at the bundled `postgres` service below — do not source this from .env,
      # otherwise a real DATABASE_URL there (e.g. Supabase) would silently override it.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medicare?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/medicare?schema=public
      # Safe here: this Postgres is dedicated to this compose stack, not a shared/production DB.
      RUN_DB_PUSH: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in your .env file}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medicare.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file}
      # Base URL for the "Join video call" links in appointment emails.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Appointment confirmation emails. All optional: with no SMTP host the booking still
      # succeeds and the skipped mail is logged instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Socket.IO fans WebRTC signalling across instances through Redis. Points at the
      # bundled service below, so scaling `app` to more than one replica keeps working.
      REDIS_URL: redis://redis:6379
      # Optional TURN relay for WebRTC. Without one, calls fail on networks that cannot
      # establish a direct peer-to-peer path (symmetric NAT, some corporate firewalls).
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Signalling messages are transient and worthless after the call connects, so there is
    # nothing here worth persisting to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medicare"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
